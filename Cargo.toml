[package]
name = "pact-sse-plugin"
version = "0.2.0"
edition = "2024"

[dependencies]
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.3"
prost-types = "0.14.3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
maplit = "1.0.2"
pact_matching = "~2.0.5"
pact_models = "~1.3"
pact-plugin-driver = "~1.0.0-beta.2"
logos = "~0.14"
anyhow = "1"
serde_json = "1"
bytes = { version = "1", features = ["serde"] }
either = "1"
itertools = "0.14"

[build-dependencies]
tonic-prost-build = "0.14.6"

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
lto = true
